disabled_rules:
  - identifier_name
  - inclusive_language
  - shorthand_operator

excluded:
  - Pods

line_length:
  warning: 150
  error: 150
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 300

type_name:
  allowed_symbols: ["_"] # for previews
  min_length: 3
  max_length:
    warning: 60
    error: 60
  excluded:
    - Id
